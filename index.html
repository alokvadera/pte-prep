<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Body text is the usual Largest Contentful Paint element, so the one face it
      needs is fetched ahead of the stylesheet rather than discovered inside it.
      Only the regular weight is preloaded: preloading the whole family costs
      more bandwidth than the swap delay it would save.
    -->
    <link
      rel="preload"
      href="/fonts/InstrumentSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="theme-color" content="#ffffff" />
    <!--
      Applies the saved theme before first paint. The React layout applies the
      class again once the settings store hydrates; this runs earlier so a
      returning dark visitor never sees a white flash. The store deliberately
      has no `system` theme, so nothing here reads the OS preference: no saved
      choice means light, which is what the prerendered markup was built as.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('pte-prep-settings')
          var settings = raw ? JSON.parse(raw)?.state?.settings : null
          var dark = settings?.theme === 'dark'
          if (dark) {
            document.documentElement.classList.add('dark')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#171b20')
          }
          // Same store, same pre-paint moment: the text scale is set on the
          // root font size, so applying it here avoids a visible reflow when
          // the React effect would otherwise set it after hydration.
          var scale = Number(settings?.textScale)
          if (scale >= 0.8 && scale <= 1.5 && scale !== 1) {
            document.documentElement.style.fontSize = 16 * scale + 'px'
          }
        } catch {
          /* unreadable storage: paint the light default */
        }
      })()
    </script>
    <title>PTE Prep — Free Unlimited PTE Academic Mock Tests</title>
    <meta
      name="description"
      content="Free, unlimited PTE Academic mock tests. Full timed sections, all 22 question types, detailed score reports, CEFR band and question-level review. No signup, no server, runs in your browser."
    />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="PTE Prep — Free Unlimited PTE Academic Mock Tests" />
    <meta
      property="og:description"
      content="Full-length timed PTE Academic mock tests with detailed score reports. No signup required."
    />
    <meta property="og:type" content="website" />
    <!--
      Self-hosted: no third-party request, and the app works offline.
      Only the body face is preloaded. Body text is the usual Largest Contentful
      Paint element, so fetching it ahead of the stylesheet is what moves LCP;
      preloading the serif and mono faces as well cost more bandwidth than the
      swap delay they saved. All three ship as WOFF2, which is roughly a third
      of the size of the same face as TTF.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>PTE Prep needs JavaScript enabled to run practice tests in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
