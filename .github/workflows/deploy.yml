name: Deploy to GitHub Pages

# GitHub Pages' free tier is enough: the build output is a static bundle with no
# server, no database and no per-request cost.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      # Canonical URLs and sitemap.xml use this. Change it to the Pages URL, or
      # set the SITE_ORIGIN repository variable for a custom domain.
      - name: Configure site origin
        run: echo "SITE_ORIGIN=${{ vars.SITE_ORIGIN || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}" >> "$GITHUB_ENV"

      # A custom domain serves from the root; the default project Pages URL
      # serves from /<repo>/, and BASE_PATH keeps assets, links, the router
      # and the manifest working there. Explicitly set wins over both.
      - name: Configure base path
        run: |
          if [ -n "${{ vars.BASE_PATH }}" ]; then
            echo "BASE_PATH=${{ vars.BASE_PATH }}" >> "$GITHUB_ENV"
          elif [ -n "${{ vars.SITE_ORIGIN }}" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      # `seo:audit` is deliberately not here: it needs the built site, and the
      # "Audit static output" step below runs it after the build.
      - name: Verify
        run: npm run typecheck && npm run lint && npm run test && npm run test:bank && npm run test:boundary && npm run test:answers && npm run contrast

      - name: Build and prerender
        run: npm run build

      - name: Audit static output
        run: npm run seo:audit

      - name: Browser checks
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          node scripts/serve.mjs 5200 dist &
          SERVER_PID=$!
          sleep 2
          node scripts/browser-check.mjs http://localhost:5200 --strict
          node scripts/seo-audit-browser.mjs http://localhost:5200 --strict
          kill $SERVER_PID

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
