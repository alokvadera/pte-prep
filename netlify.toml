[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Real domain for canonical URLs and sitemap.xml. The build FAILS on the
  # placeholder below, so replace it (or set SITE_ORIGIN in the Netlify UI,
  # which wins over this file).
  SITE_ORIGIN = "https://your-site.netlify.app"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /test/ and /result/ are real prerendered shells in dist/, so no redirect
# rules are needed for them — Netlify serves the files directly.
